[project]
name = "cs238-project1"
version = "0.1.0"
description = "Bayesian network structure learning for AA228/CS238 Project 1"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["project1/tests"]
pythonpath = ["project1"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["project1/project1.jl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"project1/tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["project1"]
mypy_path = "project1"

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[project]
name = "cs238"
version = "0.2.0"
description = "AA228/CS238 projects: Bayesian structure learning (1) and offline RL (2)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["project1/tests", "project2/tests"]
pythonpath = ["project1", "project2"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["project1/project1.jl"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"project1/tests/*" = ["D"]
"project2/tests/*" = ["D"]

[tool.mypy]
strict = true
files = ["project1", "project2"]
mypy_path = "project1:project2"

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true
